{% extends "base.html" %}
{% load static %}

{% block body %}
<div class="min-h-screen flex flex-col bg-slate-100 w-full max-w-full overflow-x-hidden">
    {% include "sidebar.html" %}
    <main class="main-content-responsive flex-1 min-w-0 lg:ml-64 px-4 py-5 sm:px-6 sm:py-7 lg:px-10 pb-20">
        <button type="button" class="lg:hidden fixed top-4 left-4 z-30 flex items-center justify-center w-12 h-12 rounded-xl bg-white border border-slate-200 shadow-lg hover:bg-slate-50 text-slate-700" data-mobile-menu-toggle>
            <i class="bi bi-list text-xl"></i>
        </button>

        <div class="max-w-lg mx-auto mt-12 lg:mt-0">
            <a href="{% url 'historial_llamadas' %}" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-slate-900 mb-6">
                <i class="bi bi-arrow-left"></i>Volver al historial
            </a>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-6 py-5 border-b border-slate-100 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center flex-shrink-0">
                        <i class="bi bi-file-earmark-pdf text-base"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-bold text-slate-900">Exportar reporte de adherencia</h1>
                        <p class="text-xs text-slate-500 mt-0.5">Elige los filtros y descarga el PDF</p>
                    </div>
                </div>

                <form method="get" action="{% url 'exportar_historial_pdf' %}" class="p-6 space-y-5">
                    <input type="hidden" name="generar" value="1">

                    <!-- Paciente -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Paciente</label>
                        <select name="paciente" class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-slate-400 transition-colors">
                            <option value="">Todos los pacientes</option>
                            {% for p in pacientes %}
                            <option value="{{ p.id }}">{{ p.get_display_nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Periodo -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Periodo</label>
                        <div class="grid grid-cols-2 gap-2">
                            {% for val, label in periodos %}
                            <label class="flex items-center gap-2 border border-slate-200 rounded-xl px-3 py-2.5 text-sm text-slate-700 cursor-pointer hover:bg-slate-50 transition-colors has-[:checked]:border-slate-900 has-[:checked]:bg-slate-50 has-[:checked]:font-semibold">
                                <input type="radio" name="periodo" value="{{ val }}" {% if forloop.first %}checked{% endif %} class="accent-slate-900">
                                {{ label }}
                            </label>
                            {% endfor %}
                        </div>
                    </div>

                    <!-- Rango personalizado (se muestra solo si periodo=personalizado) -->
                    <div id="rango-personalizado" class="hidden grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Desde</label>
                            <input type="date" name="desde" class="block w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Hasta</label>
                            <input type="date" name="hasta" class="block w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
                        </div>
                    </div>

                    <!-- Estado -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Estado de la llamada</label>
                        <select name="estado" class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-slate-400 transition-colors">
                            <option value="">Todos los estados</option>
                            <option value="completada">Completadas</option>
                            <option value="fallida">Fallidas</option>
                            <option value="programada">Programadas</option>
                        </select>
                    </div>

                    <!-- Resultado -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Resultado</label>
                        <select name="resultado" class="block w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-slate-400 transition-colors">
                            <option value="">Todos los resultados</option>
                            <option value="confirmada">Confirmadas (tomó el medicamento)</option>
                            <option value="negativa">Negativas (no tomó)</option>
                            <option value="sin_confirmar">Sin confirmar / No atendió</option>
                            <option value="despues">Aplazadas (tomará después)</option>
                            <option value="emergencia">Emergencias</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white py-3 text-sm font-semibold transition-colors">
                        <i class="bi bi-download"></i>Descargar reporte PDF
                    </button>
                </form>
            </div>
        </div>
    </main>
    {% include "footer.html" %}
</div>

<script>
document.querySelectorAll('input[name="periodo"]').forEach(function (radio) {
    radio.addEventListener('change', function () {
        document.getElementById('rango-personalizado').classList.toggle('hidden', this.value !== 'personalizado');
    });
});
</script>
{% endblock %}
