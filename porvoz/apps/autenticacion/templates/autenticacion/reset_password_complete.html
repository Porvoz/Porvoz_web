{% extends "base.html" %}
{% load static %}

{% block body %}
<div class="min-h-screen flex flex-col bg-white">
    <div class="flex flex-1 items-center justify-center py-10 px-4">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-xl p-8 text-center">
                <div class="flex justify-center mb-6">
                    <img src="{% static 'images/LogoPorvoz.png' %}" data-logo="1" data-fallback-src="{% static 'LogoPorvoz.png' %}" alt="Porvoz" class="h-14 w-auto object-contain">
                </div>
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-600 mb-5">
                    <i class="bi bi-shield-check text-3xl"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-slate-900 mb-2">Contraseña actualizada</h2>
                <p class="text-sm text-slate-600 mb-8">Tu contraseña fue cambiada exitosamente. Ya puedes iniciar sesión con tu nueva contraseña.</p>
                <a href="{% url 'login' %}" class="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 px-6 py-3.5 text-sm font-semibold text-white shadow-lg transition-all w-full">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Iniciar sesión
                </a>
            </div>
        </div>
    </div>
    <div class="mt-auto">{% include "footer.html" %}</div>
</div>
{% endblock %}
