<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
    <h2 class="text-base font-bold text-slate-900 mb-2 flex items-center gap-2">
        <i class="bi bi-shield-lock text-slate-600"></i> Cambiar contraseña
    </h2>
    <p class="text-xs text-slate-500 mb-6">El usuario podrá iniciar sesión con la nueva contraseña inmediatamente.</p>

    <form method="post" class="space-y-5 max-w-md">
        {% csrf_token %}
        <input type="hidden" name="accion" value="password">

        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nueva contraseña</label>
            <div class="relative">
                <i class="bi bi-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="password" name="nueva_password" required minlength="8" placeholder="Mínimo 8 caracteres"
                    class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-slate-800 outline-none">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Confirmar contraseña</label>
            <div class="relative">
                <i class="bi bi-lock-fill absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="password" name="confirmar_password" required minlength="8" placeholder="Repite la contraseña"
                    class="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-slate-800 outline-none">
            </div>
        </div>

        <button type="submit"
            class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition-colors flex items-center gap-2">
            <i class="bi bi-key"></i> Cambiar contraseña
        </button>
    </form>
</div>
