{% extends "core/base.html" %}
{% load static %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-800 py-10 px-4">
    <div class="relative w-full max-w-3xl">
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-400/20 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-16 -left-16 w-56 h-56 bg-slate-300/10 rounded-full blur-3xl"></div>

        <div class="relative bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/50 px-8 py-8">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900">Crear cuenta</h2>
                    <p class="text-xs text-gray-500 mt-1">Regístrate como paciente o cuidador para comenzar.</p>
                </div>
                <img src="{% static 'images/LogoPorvoz.jpeg' %}" data-logo="1" data-fallback-src="{% static 'LogoPorvoz.jpeg' %}" alt="Porvoz" class="w-28 h-12 object-contain rounded-lg bg-slate-100 p-1">
            </div>

            {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                    <div class="text-sm px-3 py-2 rounded-lg 
                        {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200
                        {% elif message.tags == 'success' %}bg-emerald-50 text-emerald-700 border border-emerald-200
                        {% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                {% csrf_token %}
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Nombre</label>
                            <input name="first_name" type="text" required class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Apellido</label>
                            <input name="last_name" type="text" required class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Usuario</label>
                        <input name="username" type="text" required
                               class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Correo electrónico</label>
                        <input name="email" type="email" required
                               class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Contraseña</label>
                        <input name="password" type="password" required
                               class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Confirmar contraseña</label>
                        <input name="password2" type="password" required
                               class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Fecha de nacimiento</label>
                        <input name="date_of_birth" type="date" required class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Ciudad</label>
                        <input name="city" type="text" required class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Teléfono</label>
                        <div class="grid grid-cols-[90px_1fr] gap-2">
                            <select name="phone_country" class="rounded-xl border-gray-300 text-sm">
                                <option value="+57">+57</option>
                                <option value="+1">+1</option>
                                <option value="+34">+34</option>
                                <option value="+52">+52</option>
                            </select>
                            <input name="phone_number" type="text" required placeholder="3001234567" class="rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Documento de identidad</label>
                        <div class="grid grid-cols-[180px_1fr] gap-2">
                            <select name="document_type" class="rounded-xl border-gray-300 text-sm">
                                <option value="cc">Cédula ciudadanía</option>
                                <option value="ce">Cédula extranjería</option>
                                <option value="ti">Tarjeta identidad</option>
                                <option value="pp">Pasaporte</option>
                            </select>
                            <input name="document_number" type="text" required placeholder="Número" class="rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Contacto de emergencia (nombre)</label>
                        <input name="emergency_contact_name" type="text" required class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Contacto de emergencia (teléfono)</label>
                        <div class="grid grid-cols-[90px_1fr] gap-2">
                            <select name="emergency_contact_phone_country" class="rounded-xl border-gray-300 text-sm">
                                <option value="+57">+57</option>
                                <option value="+1">+1</option>
                                <option value="+34">+34</option>
                                <option value="+52">+52</option>
                            </select>
                            <input name="emergency_contact_phone_number" type="text" required placeholder="3001234567" class="rounded-xl border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm px-3 py-2">
                        </div>
                    </div>
                    <fieldset>
                        <legend class="block text-xs font-medium text-gray-700 mb-2">Rol</legend>
                        <div class="grid grid-cols-2 gap-3">
                            <label for="role_patient" class="cursor-pointer rounded-xl border border-gray-200 p-3 transition hover:border-indigo-500 hover:bg-indigo-50">
                                <div class="flex items-center gap-2">
                                <input id="role_patient" type="radio" name="role" value="patient" required checked class="h-4 w-4 border-gray-300 text-slate-900 focus:ring-slate-700">
                                    <i class="bi bi-person-heart text-indigo-600"></i>
                                    <span class="text-sm font-semibold text-gray-800">Paciente</span>
                                </div>
                                <p class="mt-2 text-[11px] text-gray-500">Recibe recordatorios y seguimiento.</p>
                            </label>
                            <label for="role_caregiver" class="cursor-pointer rounded-xl border border-gray-200 p-3 transition hover:border-indigo-500 hover:bg-indigo-50">
                                <div class="flex items-center gap-2">
                                <input id="role_caregiver" type="radio" name="role" value="caregiver" required class="h-4 w-4 border-gray-300 text-slate-900 focus:ring-slate-700">
                                    <i class="bi bi-person-hearts text-indigo-600"></i>
                                    <span class="text-sm font-semibold text-gray-800">Cuidador</span>
                                </div>
                                <p class="mt-2 text-[11px] text-gray-500">Gestiona pacientes y alertas.</p>
                            </label>
                        </div>
                    </fieldset>
                    <div class="pt-4">
                        <button type="submit"
                                class="w-full inline-flex justify-center items-center rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white shadow-md hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-700 focus:ring-offset-2">
                            Crear cuenta
                        </button>
                        <p class="mt-3 text-center text-[11px] text-gray-500">
                            ¿Ya tienes cuenta?
                            <a href="{% url 'login' %}" class="text-indigo-600 hover:text-indigo-700 font-semibold">Inicia sesión</a>
                        </p>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
