{% load static %}
<!-- Panel mínimo tipo sidebar: solo rellena el espacio a la izquierda (solo desktop) -->
<aside class="hidden lg:flex flex-col w-64 flex-shrink-0 bg-white border-r border-slate-200">
    <div class="p-4 border-b border-slate-200">
        <a href="{% url 'login' %}">
            <img src="{% static 'images/LogoPorvoz.png' %}" alt="Porvoz" class="h-10 w-auto object-contain">
        </a>
    </div>
    <nav class="p-4 flex flex-col gap-1 text-sm">
        <a href="{% url 'login' %}" class="px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold flex items-center gap-2">
            <i class="bi bi-box-arrow-in-right"></i>Iniciar sesión
        </a>
        <a href="{% url 'register' %}" class="px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold flex items-center gap-2">
            <i class="bi bi-person-plus"></i>Crear cuenta
        </a>
        <a href="{% url 'plans' %}" class="px-3 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold flex items-center gap-2">
            <i class="bi bi-star"></i>Ver planes
        </a>
    </nav>
</aside>
