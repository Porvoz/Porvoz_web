{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porvoz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="preload" href="{% static 'images/LogoPorvoz_sidebar.png' %}" as="image">
    <style>
        /* ===== VARIABLES CSS GLOBALES ===== */
        :root {
            --breakpoint-lg: 1024px;
            --color-primary: #0d9488; /* emerald-600 */
            --color-danger: #dc2626;   /* red-600 */
            --color-warning: #f59e0b;  /* amber-500 */
            --color-info: #0ea5e9;     /* sky-500 */
        }

        /* Evitar scroll horizontal en móvil y desktop */
        html, body { overflow-x: hidden; max-width: 100vw; }
        body { min-height: 100vh; }

        /* Desktop sidebar styles */
        .sidebar {
            transition: width .2s ease, transform .3s ease;
        }
        .sidebar.collapsed {
            width: 88px !important;
        }
        .sidebar.collapsed .label-text {
            display: none;
        }
        .sidebar.collapsed .brand-text {
            display: none;
        }
        .sidebar.collapsed .sidebar-logo {
            display: none !important;
        }
        .sidebar.collapsed .sidebar-logo-expanded,
        .sidebar.collapsed .sidebar-logo-collapsed {
            display: none !important;
        }
        .sidebar.collapsed .sidebar-header {
            justify-content: center;
        }
        .sidebar.collapsed .user-meta {
            display: none;
        }
        .sidebar.collapsed .nav-link {
            justify-content: center;
        }
        .sidebar.collapsed .nav-link i {
            margin-right: 0 !important;
        }
        .sidebar.collapsed .logout-btn {
            justify-content: center;
        }
        .sidebar.collapsed .logout-btn span {
            display: none;
        }
        .sidebar.collapsed .sidebar-toggle i::before {
            content: "\f284";
        }
        .sidebar-toggle i {
            transition: transform 0.3s ease;
        }

        /* Badge notificaciones: colapsado = bolita esquina (como antes) */
        .sidebar.collapsed .nav-notif-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            min-width: 18px;
            height: 18px;
            font-size: 10px;
            padding: 0 4px;
        }
        /* Expandido = más a la derecha, bola y número bien dimensionados */
        .sidebar:not(.collapsed) .nav-notif-badge {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            min-width: 22px;
            height: 22px;
            font-size: 11px;
            padding: 0 6px;
        }
        .sidebar.collapsed .sidebar-toggle i {
            transform: rotate(180deg);
        }

        /* Contenido principal: redimensiona con el sidebar en desktop (lg: 1024px) */
        @media (min-width: 1024px) {
            .main-content-responsive {
                margin-left: 16rem;
                transition: margin-left .2s ease;
            }
            body.sidebar-is-collapsed .main-content-responsive {
                margin-left: 5.5rem; /* 88px, mismo ancho que sidebar colapsado */
            }
            /* Contenedores de contenido: se expanden cuando el sidebar está colapsado */
            .main-content-responsive .content-max {
                max-width: 56rem;
                transition: max-width .2s ease;
            }
            body.sidebar-is-collapsed .main-content-responsive .content-max {
                max-width: 72rem;
            }
            /* Variante más ancha (ej: editar paciente) */
            .main-content-responsive .content-max-wide {
                max-width: 72rem;
                transition: max-width .2s ease;
            }
            body.sidebar-is-collapsed .main-content-responsive .content-max-wide {
                max-width: 88rem;
            }
        }

        /* Sidebar overlay en móvil y tablet (< 1024px) - mismo breakpoint que lg */
        @media (max-width: 1023px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px !important;
                transition: transform 0.25s ease;
            }
            .sidebar.collapsed {
                width: 280px !important;
            }
            .sidebar.mobile-open {
                transform: translateX(0);
                box-shadow: 0.5rem 0 2rem rgba(0,0,0,0.15);
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(15, 23, 42, 0.5);
                z-index: 18;
                opacity: 0;
                transition: opacity 0.25s ease;
            }
            .sidebar-overlay.active {
                display: block;
                opacity: 1;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    {% block body %}{% endblock %}

    <script>
        (function () {
            const STORAGE_KEY = "porvoz-sidebar-collapsed";
            const MOBILE_BREAKPOINT = 1024; /* mismo que lg en Tailwind */

            function isMobile() {
                return window.innerWidth <= MOBILE_BREAKPOINT;
            }

            function applyInitialState() {
                if (isMobile()) {
                    return;
                }
                const shouldCollapse = window.localStorage.getItem(STORAGE_KEY) === "1";
                document.querySelectorAll(".sidebar").forEach(function (sidebar) {
                    if (shouldCollapse) sidebar.classList.add("collapsed");
                });
                if (shouldCollapse) document.body.classList.add("sidebar-is-collapsed");
            }

            function syncBodySidebarState() {
                if (isMobile()) return;
                const sidebar = document.querySelector(".sidebar");
                if (!sidebar) return;
                if (sidebar.classList.contains("collapsed")) {
                    document.body.classList.add("sidebar-is-collapsed");
                } else {
                    document.body.classList.remove("sidebar-is-collapsed");
                }
            }

            function setupDesktopToggle() {
                document.addEventListener("click", function (event) {
                    const button = event.target.closest("[data-sidebar-toggle]");
                    if (!button) return;
                    event.preventDefault();
                    const sidebar = button.closest(".sidebar");
                    if (!sidebar) return;
                    if (isMobile()) return;
                    
                    const collapsed = sidebar.classList.toggle("collapsed");
                    if (collapsed) document.body.classList.add("sidebar-is-collapsed");
                    else document.body.classList.remove("sidebar-is-collapsed");
                    try {
                        window.localStorage.setItem(STORAGE_KEY, collapsed ? "1" : "0");
                    } catch (e) {}
                });
            }

            function setupMobileToggle() {
                // Toggle del botón hamburguesa
                document.addEventListener("click", function (event) {
                    const button = event.target.closest("[data-mobile-menu-toggle]");
                    if (!button) return;
                    event.preventDefault();
                    toggleMobileSidebar();
                });

                // Cerrar al hacer click en overlay
                document.addEventListener("click", function (event) {
                    if (event.target.classList.contains("sidebar-overlay")) {
                        closeMobileSidebar();
                    }
                });

                // Cerrar al hacer click en un link del sidebar en móvil
                document.addEventListener("click", function (event) {
                    if (!isMobile()) return;
                    const navLink = event.target.closest(".sidebar .nav-link");
                    if (navLink) {
                        // Pequeño delay para que se vea la transición
                        setTimeout(function() {
                            closeMobileSidebar();
                        }, 150);
                    }
                });
            }

            function toggleMobileSidebar() {
                const sidebar = document.querySelector(".sidebar");
                const overlay = document.querySelector(".sidebar-overlay");
                if (!sidebar) return;

                const isOpen = sidebar.classList.contains("mobile-open");
                if (isOpen) {
                    closeMobileSidebar();
                } else {
                    openMobileSidebar();
                }
            }

            function openMobileSidebar() {
                const sidebar = document.querySelector(".sidebar");
                const overlay = document.querySelector(".sidebar-overlay");
                if (sidebar) {
                    sidebar.classList.add("mobile-open");
                }
                if (overlay) {
                    overlay.classList.add("active");
                    document.body.style.overflow = "hidden";
                }
            }

            function closeMobileSidebar() {
                const sidebar = document.querySelector(".sidebar");
                const overlay = document.querySelector(".sidebar-overlay");
                if (sidebar) {
                    sidebar.classList.remove("mobile-open");
                }
                if (overlay) {
                    overlay.classList.remove("active");
                    document.body.style.overflow = "";
                }
            }

            function handleResize() {
                if (isMobile()) {
                    closeMobileSidebar();
                    document.querySelectorAll(".sidebar").forEach(function(s) {
                        s.classList.remove("collapsed");
                    });
                    document.body.classList.remove("sidebar-is-collapsed");
                } else {
                    closeMobileSidebar();
                    applyInitialState();
                }
            }

            window.addEventListener("resize", function() {
                handleResize();
            });

            document.addEventListener("DOMContentLoaded", function () {
                applyInitialState();
                syncBodySidebarState();
                setupDesktopToggle();
                setupMobileToggle();
            });

            // Logo fallback: if static/images path fails, try static root path.
            document.addEventListener(
                "error",
                function (event) {
                    const img = event.target;
                    if (!(img instanceof HTMLImageElement)) return;
                    if (!img.hasAttribute("data-logo")) return;
                    if (img.dataset.fallbackTried === "1") {
                        const fallbackBlock = img.nextElementSibling;
                        if (fallbackBlock) fallbackBlock.style.display = "flex";
                        return;
                    }
                    const fallbackSrc = img.getAttribute("data-fallback-src");
                    if (!fallbackSrc) return;
                    img.dataset.fallbackTried = "1";
                    img.src = fallbackSrc;
                },
                true
            );
        })();
    </script>
    <script src="{% static 'js/utils.js' %}"></script>
    <script src="{% static 'js/autocomplete.js' %}"></script>
    <script src="{% static 'js/charts.js' %}"></script>
</body>
</html>
