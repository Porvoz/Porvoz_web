{% load static %}
{% if user.is_authenticated %}
<!-- Header visible solo en mobile - dropdown de usuario -->
<header class="lg:hidden fixed top-0 left-0 right-0 h-14 bg-white border-b border-slate-200 z-40 flex items-center justify-between px-4">
    <!-- Logo/title area -->
    <div class="flex items-center gap-2 min-w-0 flex-1">
        <img src="{% static 'images/LogoPorvoz_sidebar.png' %}" alt="Porvoz" class="h-8 w-8 object-contain">
    </div>

    <!-- User dropdown menu (mobile only) -->
    <div class="relative">
        <button type="button" class="header-user-toggle flex items-center gap-2 p-2 rounded-lg hover:bg-slate-100 text-slate-600" aria-label="Menú de usuario">
            {% if perfil.profile_image %}
            <img src="{{ perfil.profile_image.url }}" alt="" class="h-8 w-8 rounded-full object-cover border border-slate-200">
            {% else %}
            <div class="h-8 w-8 rounded-full bg-slate-600 text-white flex items-center justify-center text-xs font-bold">
                {{ request.user.first_name|default:request.user.username|slice:":1"|upper }}
            </div>
            {% endif %}
            <i class="bi bi-chevron-down text-sm"></i>
        </button>

        <!-- Dropdown menu -->
        <div class="header-user-dropdown hidden absolute right-0 mt-2 w-56 bg-white rounded-lg border border-slate-200 shadow-lg z-50">
            <!-- User info -->
            <div class="px-4 py-3 border-b border-slate-100">
                <p class="text-sm font-semibold text-slate-900 truncate">{{ perfil.first_name|default:request.user.first_name|default:request.user.username }}</p>
                <p class="text-xs text-slate-500 truncate">{{ request.user.email|default:"" }}</p>
            </div>

            <!-- Menu items -->
            <div class="py-2">
                <a href="{% url 'edit_profile' %}" class="px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 flex items-center gap-2 block">
                    <i class="bi bi-gear text-slate-600"></i>
                    Mi cuenta
                </a>
                <a href="{% url 'guide' %}" class="px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 flex items-center gap-2 block">
                    <i class="bi bi-question-circle text-slate-600"></i>
                    Ayuda
                </a>
            </div>

            <!-- Logout -->
            <div class="border-t border-slate-100 py-2">
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="w-full px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 font-semibold">
                        <i class="bi bi-box-arrow-right"></i>
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

<!-- Spacer para el header en mobile -->
<div class="lg:hidden h-14"></div>

<script>
    // Toggle dropdown en mobile
    document.addEventListener('click', function(event) {
        const toggle = event.target.closest('.header-user-toggle');
        const dropdown = document.querySelector('.header-user-dropdown');

        if (toggle) {
            event.preventDefault();
            dropdown.classList.toggle('hidden');
        } else if (!event.target.closest('.header-user-dropdown')) {
            dropdown.classList.add('hidden');
        }
    });

    // Cerrar dropdown al hacer logout
    document.addEventListener('submit', function(event) {
        const form = event.target;
        if (form.action.includes('/logout/')) {
            const dropdown = document.querySelector('.header-user-dropdown');
            if (dropdown) {
                dropdown.classList.add('hidden');
            }
        }
    });
</script>
{% endif %}
