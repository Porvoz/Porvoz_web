<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 24px;
            margin: 0;
        }
        .content {
            padding: 40px 30px;
        }
        .content h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .content p {
            line-height: 1.6;
            margin-bottom: 15px;
            color: #555;
        }
        .alert {
            padding: 15px 20px;
            border-left: 4px solid #667eea;
            background-color: #f0f4ff;
            margin: 20px 0;
            border-radius: 4px;
        }
        .alert.urgente {
            border-left-color: #f59e0b;
            background-color: #fff7ed;
        }
        .alert.critica {
            border-left-color: #dc2626;
            background-color: #fef2f2;
        }
        .alert.baja {
            border-left-color: #10b981;
            background-color: #f0fdf4;
        }
        .info-block {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .info-block strong {
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }
        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white !important;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            margin: 20px 0;
            text-align: center;
        }
        .cta-button:hover {
            opacity: 0.9;
        }
        .footer {
            background: #f8f9fa;
            padding: 30px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 5px;
            vertical-align: middle;
        }
        .badge.urgente {
            background: #fef3c7;
            color: #b45309;
        }
        .badge.critica {
            background: #fee2e2;
            color: #991b1b;
        }
        .badge.normal {
            background: #dbeafe;
            color: #0c2d6b;
        }
        .badge.baja {
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ titulo }}</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>Este es un mensaje automático de <strong>Porvoz</strong></p>
            <p>
                <a href="{{ url_app }}">Ir a Porvoz</a> |
                <a href="{{ url_preferencias }}">Configurar notificaciones</a>
            </p>
            <p style="margin-top: 15px; color: #ccc;">
                © {% now "Y" %} Porvoz. Todos los derechos reservados.
            </p>
        </div>
    </div>
</body>
</html>
