# =============================================================================
# Porvoz — Production-ready Compose stack
#
#   docker compose up -d                           # base stack
#   docker compose --profile monitoring up -d      # base + Flower
#
# For local development override use docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================

x-django-build: &django-build
  context: .
  dockerfile: docker/django/Dockerfile

x-django-env: &django-env
  DATABASE_URL: postgresql://porvoz:${DB_PASSWORD:-porvoz_secret}@db:5432/porvoz
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  DJANGO_SETTINGS_MODULE: config.settings.production

x-django-depends: &django-depends
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: porvoz
      POSTGRES_USER: porvoz
      POSTGRES_PASSWORD: ${DB_PASSWORD:-porvoz_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porvoz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: *django-build
    restart: unless-stopped
    env_file: .env
    environment: *django-env
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on: *django-depends
    expose:
      - "10000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  celery-worker:
    build: *django-build
    command: ["celery-worker"]
    restart: unless-stopped
    env_file: .env
    environment: *django-env
    depends_on: *django-depends

  celery-beat:
    build: *django-build
    command: ["celery-beat"]
    restart: unless-stopped
    env_file: .env
    environment: *django-env
    depends_on: *django-depends

  # Optional task monitor — start with: docker compose --profile monitoring up
  flower:
    build: *django-build
    command: ["flower"]
    restart: unless-stopped
    env_file: .env
    environment: *django-env
    depends_on: *django-depends
    ports:
      - "5555:5555"
    profiles:
      - monitoring

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_files:
  static_files:
