name: Deploy to Production

on:
  push:
    branches: [main]


jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ========================================================================
      # Tests (MUST PASS before deployment)
      # ========================================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: porvoz/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev build-essential

      - name: Install Python dependencies
        run: pip install -r porvoz/requirements.txt ruff coverage

      - name: Lint with ruff
        working-directory: porvoz
        run: ruff check apps config

      - name: Run tests
        working-directory: porvoz
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-secret-key-only-for-tests
        run: python manage.py test --verbosity 2

      - name: Build Docker image (verify only)
        run: docker build -f docker/django/Dockerfile -t porvoz:ci .

