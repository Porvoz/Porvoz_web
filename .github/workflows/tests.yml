name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: porvoz/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        working-directory: porvoz
        run: ruff check apps config

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: porvoz/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y default-libmysqlclient-dev build-essential

      - name: Install Python dependencies
        run: pip install -r porvoz/requirements.txt

      - name: Run tests
        working-directory: porvoz
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-secret-key-only-for-tests
        run: python manage.py test --verbosity 2

  # ------------------------------------------------------------------
  # Deploy gate: only runs on pushes to main (not PRs)
  # Extend this job to trigger Railway / Render / Fly deploy via CLI.
  # ------------------------------------------------------------------
  deploy-gate:
    name: Deploy gate (main only)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Verify migrations are not pending
        working-directory: porvoz
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-secret-key-only-for-tests
        run: |
          pip install -r requirements.txt --quiet
          python manage.py migrate --check
        continue-on-error: true

      - name: Print deploy summary
        run: |
          echo "✅ All checks passed on main."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Add your deploy step here (railway up / fly deploy / etc.)"
