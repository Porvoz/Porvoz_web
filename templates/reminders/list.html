{% extends "base.html" %}
{% block title %} — Recordatorios{% endblock %}
{% block nav_reminders %}active{% endblock %}

{% block content %}
<div x-data="remindersApp()" x-init="init()">
  <!-- Header -->
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-[hsl(213,31%,91%)]">Recordatorios</h1>
      <p class="text-[hsl(215,20%,55%)] mt-1">Programa y gestiona recordatorios automáticos.</p>
    </div>
    <button @click="openAdd()" class="btn-primary flex items-center gap-2">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
      Nuevo Recordatorio
    </button>
  </div>

  <!-- Table -->
  <div class="card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr class="border-b border-[hsl(222,47%,18%)]">
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Título</th>
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Contacto</th>
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Programado</th>
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Estado</th>
            <th class="text-right px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <template x-if="loading">
            <tr><td colspan="5" class="px-6 py-12 text-center">
              <div class="flex justify-center"><div class="h-6 w-6 animate-spin rounded-full border-2 border-[hsl(210,100%,60%)] border-t-transparent"></div></div>
            </td></tr>
          </template>
          <template x-if="!loading && reminders.length === 0">
            <tr><td colspan="5" class="px-6 py-12 text-center text-[hsl(215,20%,45%)]">
              <svg class="h-10 w-10 mx-auto opacity-20 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              No hay recordatorios aún.
            </td></tr>
          </template>
          <template x-for="reminder in reminders" :key="reminder.id">
            <tr class="border-b border-[hsl(222,47%,18%)] hover:bg-[hsl(222,47%,13%)] transition">
              <td class="px-6 py-4">
                <div class="font-semibold text-[hsl(213,31%,91%)]" x-text="reminder.title"></div>
                <div class="text-xs text-[hsl(215,20%,45%)] mt-0.5 truncate max-w-xs" x-text="reminder.message"></div>
              </td>
              <td class="px-6 py-4 text-sm text-[hsl(215,20%,65%)]" x-text="reminder.contactName || '—'"></td>
              <td class="px-6 py-4 text-sm text-[hsl(215,20%,55%)]" x-text="fmtDate(reminder.scheduledAt)"></td>
              <td class="px-6 py-4" x-html="statusBadge(reminder.status)"></td>
              <td class="px-6 py-4">
                <div class="flex items-center justify-end gap-2">
                  <button
                    x-show="reminder.status === 'pending' || reminder.status === 'failed'"
                    @click="callNow(reminder)"
                    :disabled="callingId === reminder.id"
                    class="text-xs font-semibold text-green-400 hover:text-green-300 px-3 py-1.5 rounded-lg hover:bg-green-500/10 transition flex items-center gap-1.5">
                    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" /></svg>
                    <span x-text="callingId === reminder.id ? 'Llamando...' : 'Llamar'"></span>
                  </button>
                  <button @click="openEdit(reminder)" class="btn-ghost text-sm">Editar</button>
                  <button @click="confirmDelete(reminder)" class="text-[hsl(215,20%,55%)] hover:text-red-400 px-3 py-2 rounded-lg hover:bg-red-500/10 transition text-sm">Eliminar</button>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <template x-if="showModal">
    <div class="modal-overlay" @click.self="showModal=false">
      <div class="modal-box max-w-lg" @click.stop>
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-lg font-bold" x-text="editingReminder ? 'Editar Recordatorio' : 'Nuevo Recordatorio'"></h2>
          <button @click="showModal=false" class="text-[hsl(215,20%,55%)] hover:text-[hsl(213,31%,91%)] transition">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <form @submit.prevent="saveReminder()" class="space-y-4">
          <div>
            <label class="label">Contacto *</label>
            <select x-model="form.contactId" class="input" required>
              <option value="">Selecciona un contacto...</option>
              <template x-for="c in contacts" :key="c.id">
                <option :value="c.id" x-text="`${c.name} (${c.phone})`"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="label">Título *</label>
            <input type="text" x-model="form.title" class="input" placeholder="Tomar medicamento" required />
          </div>
          <div>
            <label class="label">Mensaje del recordatorio *</label>
            <textarea x-model="form.message" class="input" rows="3" placeholder="Recuerda tomar tu medicamento de las 3pm..." required></textarea>
          </div>
          <div>
            <label class="label">Fecha y hora *</label>
            <input type="datetime-local" x-model="form.scheduledAt" class="input" required />
          </div>
          <div x-show="editingReminder">
            <label class="label">Estado</label>
            <select x-model="form.status" class="input">
              <option value="pending">Pendiente</option>
              <option value="called">Llamado</option>
              <option value="failed">Fallido</option>
            </select>
          </div>
          <div class="flex gap-3 pt-2">
            <button type="button" @click="showModal=false" class="btn-ghost flex-1">Cancelar</button>
            <button type="submit" class="btn-primary flex-1" :disabled="saving">
              <span x-text="saving ? 'Guardando...' : (editingReminder ? 'Guardar Cambios' : 'Agregar')"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- Delete Modal -->
  <template x-if="showDelete">
    <div class="modal-overlay" @click.self="showDelete=false">
      <div class="modal-box" @click.stop>
        <h2 class="text-lg font-bold mb-2">¿Eliminar recordatorio?</h2>
        <p class="text-[hsl(215,20%,55%)] mb-6">Se eliminará <strong x-text="deletingReminder?.title"></strong>. Esta acción no se puede deshacer.</p>
        <div class="flex gap-3">
          <button @click="showDelete=false" class="btn-ghost flex-1">Cancelar</button>
          <button @click="deleteReminder()" class="btn-destructive flex-1" :disabled="saving">
            <span x-text="saving ? 'Eliminando...' : 'Eliminar'"></span>
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
function remindersApp() {
  return {
    reminders: [],
    contacts: [],
    loading: true,
    showModal: false,
    showDelete: false,
    saving: false,
    callingId: null,
    editingReminder: null,
    deletingReminder: null,
    form: { contactId: '', title: '', message: '', scheduledAt: '', status: 'pending' },

    async init() {
      const [reminders, contacts] = await Promise.all([
        fetch('/api/reminders').then(r => r.json()),
        fetch('/api/contacts').then(r => r.json()),
      ]);
      this.reminders = reminders;
      this.contacts = contacts;
      this.loading = false;
    },

    async load() {
      this.reminders = await fetch('/api/reminders').then(r => r.json());
    },

    openAdd() {
      this.editingReminder = null;
      this.form = { contactId: '', title: '', message: '', scheduledAt: '', status: 'pending' };
      this.showModal = true;
    },

    openEdit(reminder) {
      this.editingReminder = reminder;
      const local = reminder.scheduledAt
        ? new Date(reminder.scheduledAt).toISOString().slice(0, 16)
        : '';
      this.form = {
        contactId: String(reminder.contactId),
        title: reminder.title,
        message: reminder.message,
        scheduledAt: local,
        status: reminder.status,
      };
      this.showModal = true;
    },

    async saveReminder() {
      this.saving = true;
      try {
        const body = {
          contactId: parseInt(this.form.contactId),
          title: this.form.title,
          message: this.form.message,
          scheduledAt: new Date(this.form.scheduledAt).toISOString(),
          status: this.form.status,
        };
        const url = this.editingReminder ? `/api/reminders/${this.editingReminder.id}` : '/api/reminders';
        const method = this.editingReminder ? 'PATCH' : 'POST';
        const res = await fetch(url, {
          method, headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: 'Error desconocido' }));
          throw new Error(err.error || 'Error desconocido');
        }
        await this.load();
        this.showModal = false;
        showToast(this.editingReminder ? 'Recordatorio actualizado' : 'Recordatorio creado');
      } catch(e) {
        showToast('Error: ' + e.message, 'error');
      }
      this.saving = false;
    },

    confirmDelete(reminder) {
      this.deletingReminder = reminder;
      this.showDelete = true;
    },

    async deleteReminder() {
      this.saving = true;
      try {
        await fetch(`/api/reminders/${this.deletingReminder.id}`, { method: 'DELETE' });
        await this.load();
        this.showDelete = false;
        showToast('Recordatorio eliminado');
      } catch(e) {
        showToast('Error eliminando', 'error');
      }
      this.saving = false;
    },

    async callNow(reminder) {
      this.callingId = reminder.id;
      try {
        const res = await fetch(`/api/reminders/${reminder.id}/call`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showToast('Llamada iniciada correctamente', 'success');
          await this.load();
        } else {
          showToast('Error: ' + (data.message || 'No se pudo iniciar la llamada'), 'error');
        }
      } catch(e) {
        showToast('Error iniciando llamada', 'error');
      }
      this.callingId = null;
    },

    fmtDate,
    statusBadge,
  };
}
</script>
{% endblock %}
