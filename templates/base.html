<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Porvoz{% block title %}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'hsl(222 47% 7%)',
            foreground: 'hsl(213 31% 91%)',
            card: 'hsl(222 47% 11%)',
            'card-foreground': 'hsl(213 31% 91%)',
            primary: 'hsl(210 100% 60%)',
            'primary-foreground': 'hsl(222 47% 7%)',
            secondary: 'hsl(222 47% 15%)',
            'secondary-foreground': 'hsl(213 31% 80%)',
            muted: 'hsl(222 47% 15%)',
            'muted-foreground': 'hsl(215 20% 55%)',
            border: 'hsl(222 47% 18%)',
            destructive: 'hsl(0 84% 60%)',
          },
          fontFamily: {
            display: ['system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    body { @apply bg-[hsl(222,47%,7%)] text-[hsl(213,31%,91%)] min-h-screen; }
    .card { @apply bg-[hsl(222,47%,11%)] border border-[hsl(222,47%,18%)] rounded-xl; }
    .btn-primary { @apply bg-[hsl(210,100%,60%)] text-[hsl(222,47%,7%)] font-semibold px-4 py-2 rounded-lg hover:opacity-90 transition; }
    .btn-ghost { @apply text-[hsl(215,20%,55%)] hover:text-[hsl(213,31%,91%)] px-3 py-2 rounded-lg hover:bg-[hsl(222,47%,15%)] transition; }
    .btn-destructive { @apply bg-[hsl(0,84%,60%)] text-white font-semibold px-4 py-2 rounded-lg hover:opacity-90 transition; }
    .input { @apply bg-[hsl(222,47%,7%)] border border-[hsl(222,47%,18%)] text-[hsl(213,31%,91%)] rounded-lg px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-[hsl(210,100%,60%)] focus:border-transparent; }
    .label { @apply block text-sm font-medium text-[hsl(215,20%,55%)] mb-1; }
    .modal-overlay { @apply fixed inset-0 bg-black/50 backdrop-blur-sm z-40 flex items-center justify-center p-4; }
    .modal-box { @apply card w-full max-w-md p-6 z-50 shadow-2xl; }
    .badge-pending { @apply bg-amber-500/15 text-amber-400 text-xs font-semibold px-2 py-0.5 rounded-full; }
    .badge-called { @apply bg-blue-500/15 text-blue-400 text-xs font-semibold px-2 py-0.5 rounded-full; }
    .badge-completed { @apply bg-green-500/15 text-green-400 text-xs font-semibold px-2 py-0.5 rounded-full; }
    .badge-failed { @apply bg-red-500/15 text-red-400 text-xs font-semibold px-2 py-0.5 rounded-full; }
    .badge-initiated { @apply bg-slate-500/15 text-slate-400 text-xs font-semibold px-2 py-0.5 rounded-full; }
    .badge-in-progress { @apply bg-sky-500/15 text-sky-400 text-xs font-semibold px-2 py-0.5 rounded-full; }
    .nav-link { @apply flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-[hsl(215,20%,55%)] hover:text-[hsl(213,31%,91%)] hover:bg-[hsl(222,47%,15%)] transition; }
    .nav-link.active { @apply text-[hsl(210,100%,60%)] bg-[hsl(210,100%,60%)]/10; }
  </style>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body class="dark">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 border-r border-[hsl(222,47%,18%)] bg-[hsl(222,47%,9%)] flex flex-col">
      <!-- Logo -->
      <div class="px-6 py-5 border-b border-[hsl(222,47%,18%)]">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-xl bg-[hsl(210,100%,60%)] flex items-center justify-center">
            <svg class="h-5 w-5 text-[hsl(222,47%,7%)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
            </svg>
          </div>
          <div>
            <div class="font-bold text-[hsl(213,31%,91%)] leading-tight">Porvoz</div>
            <div class="text-xs text-[hsl(215,20%,55%)]">Recordatorios con IA</div>
          </div>
        </div>
      </div>
      <!-- Nav -->
      <nav class="flex-1 px-3 py-4 space-y-1">
        <a href="/" class="nav-link {% block nav_dashboard %}{% endblock %}">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" /></svg>
          Panel
        </a>
        <a href="/contacts/" class="nav-link {% block nav_contacts %}{% endblock %}">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>
          Contactos
        </a>
        <a href="/reminders/" class="nav-link {% block nav_reminders %}{% endblock %}">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          Recordatorios
        </a>
        <a href="/calls/" class="nav-link {% block nav_calls %}{% endblock %}">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" /></svg>
          Llamadas
        </a>
      </nav>
      <div class="px-4 pb-4 text-xs text-[hsl(215,20%,35%)] text-center">
        Porvoz &copy; 2026
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 overflow-auto">
      <div class="p-8 max-w-6xl mx-auto">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2"></div>

  <script>
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
      toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-xl text-sm font-medium flex items-center gap-2 transform translate-y-2 opacity-0 transition-all duration-300`;
      toast.innerHTML = message;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.style.transform = 'translateY(0)';
        toast.style.opacity = '1';
      });
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }

    function statusBadge(status) {
      const map = {
        'pending': 'badge-pending',
        'called': 'badge-called',
        'completed': 'badge-completed',
        'failed': 'badge-failed',
        'initiated': 'badge-initiated',
        'in-progress': 'badge-in-progress',
      };
      return `<span class="${map[status] || 'badge-initiated'}">${status}</span>`;
    }
  </script>
</body>
</html>
