{% extends "base.html" %}
{% block title %} — Contactos{% endblock %}
{% block nav_contacts %}active{% endblock %}

{% block content %}
<div x-data="contactsApp()" x-init="init()">
  <!-- Header -->
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold tracking-tight text-[hsl(213,31%,91%)]">Contactos</h1>
      <p class="text-[hsl(215,20%,55%)] mt-1">Gestiona tus contactos de recordatorio.</p>
    </div>
    <button @click="openAdd()" class="btn-primary flex items-center gap-2">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
      Nuevo Contacto
    </button>
  </div>

  <!-- Table -->
  <div class="card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr class="border-b border-[hsl(222,47%,18%)]">
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Nombre</th>
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Teléfono</th>
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Notas</th>
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Registrado</th>
            <th class="text-right px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <template x-if="loading">
            <tr><td colspan="5" class="px-6 py-12 text-center text-[hsl(215,20%,45%)]">
              <div class="flex justify-center"><div class="h-6 w-6 animate-spin rounded-full border-2 border-[hsl(210,100%,60%)] border-t-transparent"></div></div>
            </td></tr>
          </template>
          <template x-if="!loading && contacts.length === 0">
            <tr><td colspan="5" class="px-6 py-12 text-center text-[hsl(215,20%,45%)]">
              <svg class="h-10 w-10 mx-auto opacity-20 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" /></svg>
              No hay contactos aún. ¡Agrega uno!
            </td></tr>
          </template>
          <template x-for="contact in contacts" :key="contact.id">
            <tr class="border-b border-[hsl(222,47%,18%)] hover:bg-[hsl(222,47%,13%)] transition">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="h-9 w-9 rounded-full bg-[hsl(210,100%,60%)]/15 flex items-center justify-center text-[hsl(210,100%,60%)] font-bold text-sm" x-text="contact.name[0]?.toUpperCase()"></div>
                  <span class="font-semibold text-[hsl(213,31%,91%)]" x-text="contact.name"></span>
                </div>
              </td>
              <td class="px-6 py-4 text-sm text-[hsl(215,20%,55%)]" x-text="contact.phone"></td>
              <td class="px-6 py-4 text-sm text-[hsl(215,20%,55%)] max-w-xs truncate" x-text="contact.notes || '—'"></td>
              <td class="px-6 py-4 text-sm text-[hsl(215,20%,55%)]" x-text="fmtDate(contact.createdAt)"></td>
              <td class="px-6 py-4 text-right">
                <div class="flex items-center justify-end gap-2">
                  <button @click="openEdit(contact)" class="btn-ghost text-sm">Editar</button>
                  <button @click="confirmDelete(contact)" class="text-[hsl(215,20%,55%)] hover:text-red-400 px-3 py-2 rounded-lg hover:bg-red-500/10 transition text-sm">Eliminar</button>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <template x-if="showModal">
    <div class="modal-overlay" @click.self="showModal=false">
      <div class="modal-box" @click.stop>
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-lg font-bold" x-text="editingContact ? 'Editar Contacto' : 'Nuevo Contacto'"></h2>
          <button @click="showModal=false" class="text-[hsl(215,20%,55%)] hover:text-[hsl(213,31%,91%)] transition">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <form @submit.prevent="saveContact()" class="space-y-4">
          <div>
            <label class="label">Nombre *</label>
            <input type="text" x-model="form.name" class="input" placeholder="Juan García" required />
          </div>
          <div>
            <label class="label">Teléfono *</label>
            <input type="tel" x-model="form.phone" class="input" placeholder="+521234567890" required />
          </div>
          <div>
            <label class="label">Notas</label>
            <textarea x-model="form.notes" class="input" rows="3" placeholder="Información adicional..."></textarea>
          </div>
          <div class="flex gap-3 pt-2">
            <button type="button" @click="showModal=false" class="btn-ghost flex-1">Cancelar</button>
            <button type="submit" class="btn-primary flex-1" :disabled="saving">
              <span x-text="saving ? 'Guardando...' : (editingContact ? 'Guardar Cambios' : 'Agregar Contacto')"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- Delete Modal -->
  <template x-if="showDelete">
    <div class="modal-overlay" @click.self="showDelete=false">
      <div class="modal-box" @click.stop>
        <h2 class="text-lg font-bold mb-2">¿Eliminar contacto?</h2>
        <p class="text-[hsl(215,20%,55%)] mb-6">Se eliminará <strong x-text="deletingContact?.name"></strong> y todos sus recordatorios. Esta acción no se puede deshacer.</p>
        <div class="flex gap-3">
          <button @click="showDelete=false" class="btn-ghost flex-1">Cancelar</button>
          <button @click="deleteContact()" class="btn-destructive flex-1" :disabled="saving">
            <span x-text="saving ? 'Eliminando...' : 'Eliminar'"></span>
          </button>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
function contactsApp() {
  return {
    contacts: [],
    loading: true,
    showModal: false,
    showDelete: false,
    saving: false,
    editingContact: null,
    deletingContact: null,
    form: { name: '', phone: '', notes: '' },

    async init() {
      await this.load();
    },

    async load() {
      this.loading = true;
      try {
        this.contacts = await fetch('/api/contacts').then(r => r.json());
      } catch(e) {
        showToast('Error cargando contactos', 'error');
      }
      this.loading = false;
    },

    openAdd() {
      this.editingContact = null;
      this.form = { name: '', phone: '', notes: '' };
      this.showModal = true;
    },

    openEdit(contact) {
      this.editingContact = contact;
      this.form = { name: contact.name, phone: contact.phone, notes: contact.notes || '' };
      this.showModal = true;
    },

    async saveContact() {
      this.saving = true;
      try {
        const url = this.editingContact ? `/api/contacts/${this.editingContact.id}` : '/api/contacts';
        const method = this.editingContact ? 'PATCH' : 'POST';
        const res = await fetch(url, {
          method, headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(this.form),
        });
        if (!res.ok) throw new Error(await res.text());
        await this.load();
        this.showModal = false;
        showToast(this.editingContact ? 'Contacto actualizado' : 'Contacto creado');
      } catch(e) {
        showToast('Error guardando contacto: ' + e.message, 'error');
      }
      this.saving = false;
    },

    confirmDelete(contact) {
      this.deletingContact = contact;
      this.showDelete = true;
    },

    async deleteContact() {
      this.saving = true;
      try {
        await fetch(`/api/contacts/${this.deletingContact.id}`, { method: 'DELETE' });
        await this.load();
        this.showDelete = false;
        showToast('Contacto eliminado');
      } catch(e) {
        showToast('Error eliminando contacto', 'error');
      }
      this.saving = false;
    },

    fmtDate,
  };
}
</script>
{% endblock %}
