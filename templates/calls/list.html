{% extends "base.html" %}
{% block title %} — Llamadas{% endblock %}
{% block nav_calls %}active{% endblock %}

{% block content %}
<div x-data="callsApp()" x-init="init()">
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold tracking-tight text-[hsl(213,31%,91%)]">Historial de Llamadas</h1>
    <p class="text-[hsl(215,20%,55%)] mt-1">Registro completo de todas las llamadas realizadas.</p>
  </div>

  <!-- Table -->
  <div class="card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr class="border-b border-[hsl(222,47%,18%)]">
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Contacto</th>
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Estado</th>
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Duración</th>
            <th class="text-left px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Fecha</th>
            <th class="text-right px-6 py-4 text-xs font-semibold text-[hsl(215,20%,55%)] uppercase tracking-wider">Transcripción</th>
          </tr>
        </thead>
        <tbody>
          <template x-if="loading">
            <tr><td colspan="5" class="px-6 py-12 text-center">
              <div class="flex justify-center"><div class="h-6 w-6 animate-spin rounded-full border-2 border-[hsl(210,100%,60%)] border-t-transparent"></div></div>
            </td></tr>
          </template>
          <template x-if="!loading && calls.length === 0">
            <tr><td colspan="5" class="px-6 py-12 text-center text-[hsl(215,20%,45%)]">
              <svg class="h-10 w-10 mx-auto opacity-20 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" /></svg>
              Sin llamadas registradas aún.
            </td></tr>
          </template>
          <template x-for="call in calls" :key="call.id">
            <tr class="border-b border-[hsl(222,47%,18%)] hover:bg-[hsl(222,47%,13%)] transition">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div :class="{
                    'bg-green-500/15 text-green-400': call.status === 'completed',
                    'bg-red-500/15 text-red-400': call.status === 'failed',
                    'bg-sky-500/15 text-sky-400': call.status === 'in-progress',
                    'bg-slate-500/15 text-slate-400': call.status !== 'completed' && call.status !== 'failed' && call.status !== 'in-progress'
                  }" class="h-9 w-9 rounded-full flex items-center justify-center shrink-0">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" /></svg>
                  </div>
                  <span class="font-semibold text-[hsl(213,31%,91%)]" x-text="call.contactName || 'Desconocido'"></span>
                </div>
              </td>
              <td class="px-6 py-4" x-html="statusBadge(call.status)"></td>
              <td class="px-6 py-4 text-sm text-[hsl(215,20%,55%)]">
                <span x-show="call.duration" x-text="`${call.duration}s`"></span>
                <span x-show="!call.duration">—</span>
              </td>
              <td class="px-6 py-4 text-sm text-[hsl(215,20%,55%)]" x-text="fmtDate(call.createdAt)"></td>
              <td class="px-6 py-4 text-right">
                <button x-show="call.transcript" @click="showTranscript(call)" class="text-sm font-medium text-[hsl(210,100%,60%)] hover:underline">
                  Ver transcripción
                </button>
                <span x-show="!call.transcript" class="text-[hsl(215,20%,45%)] text-sm">—</span>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Transcript Modal -->
  <template x-if="showTranscriptModal">
    <div class="modal-overlay" @click.self="showTranscriptModal=false">
      <div class="card w-full max-w-lg p-6 z-50 shadow-2xl max-h-[80vh] flex flex-col" @click.stop>
        <div class="flex items-center justify-between mb-4 shrink-0">
          <h2 class="text-lg font-bold">Transcripción de Llamada</h2>
          <button @click="showTranscriptModal=false" class="text-[hsl(215,20%,55%)] hover:text-[hsl(213,31%,91%)] transition">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="overflow-y-auto flex-1">
          <div class="space-y-3">
            <template x-for="(line, i) in transcriptLines" :key="i">
              <div :class="line.startsWith('Asistente:') ? 'text-right' : 'text-left'">
                <div :class="line.startsWith('Asistente:') ? 'bg-[hsl(210,100%,60%)]/15 text-[hsl(210,100%,70%)]' : 'bg-[hsl(222,47%,15%)] text-[hsl(213,31%,85%)]'"
                  class="inline-block px-4 py-2 rounded-2xl text-sm max-w-[85%] text-left">
                  <div class="text-xs font-bold mb-1 opacity-70" x-text="line.startsWith('Asistente:') ? 'Asistente IA' : 'Usuario'"></div>
                  <span x-text="line.replace(/^(Asistente:|Usuario:)\s*/, '')"></span>
                </div>
              </div>
            </template>
          </div>
        </div>
        <div class="pt-4 shrink-0">
          <button @click="showTranscriptModal=false" class="btn-ghost w-full">Cerrar</button>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
function callsApp() {
  return {
    calls: [],
    loading: true,
    showTranscriptModal: false,
    selectedCall: null,

    get transcriptLines() {
      if (!this.selectedCall?.transcript) return [];
      return this.selectedCall.transcript.split('\n').filter(l => l.trim());
    },

    async init() {
      try {
        this.calls = await fetch('/api/calls').then(r => r.json());
      } catch(e) {
        showToast('Error cargando llamadas', 'error');
      }
      this.loading = false;
    },

    showTranscript(call) {
      this.selectedCall = call;
      this.showTranscriptModal = true;
    },

    fmtDate,
    statusBadge,
  };
}
</script>
{% endblock %}
